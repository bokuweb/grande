name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo test -p grande-core -p grande-eval -p grande-web -p grande-wgpu
      - run: cargo clippy -p grande-core -p grande-eval -p grande-web -p grande-server -p grande-wgpu -- -D warnings
      - run: cargo build -p grande-web --target wasm32-unknown-unknown
