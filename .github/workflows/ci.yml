name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo test -p omg-core -p omg-eval -p omg-web -p omg-wgpu
      - run: cargo clippy -p omg-core -p omg-eval -p omg-web -p omg-server -p omg-wgpu -- -D warnings
      - run: cargo build -p omg-web --target wasm32-unknown-unknown
