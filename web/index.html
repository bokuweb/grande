<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>grande — 判断モデルをブラウザで</title>
<style>
  :root { --bg: #fafafa; --fg: #1a1a1a; --muted: #6b6b6b; --line: #ddd; --card: #fff; --accent: #2563eb; --bar: #dbeafe; --ok: #16a34a; --warn: #d97706; }
  @media (prefers-color-scheme: dark) { :root { --bg: #111; --fg: #eee; --muted: #9a9a9a; --line: #333; --card: #1a1a1a; --accent: #60a5fa; --bar: #1e3a5f; } }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.5 -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif; }
  main { max-width: 1100px; margin: 0 auto; padding: 24px 16px 64px; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 20px; }
  .row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
  select, button, input[type=range] { font: inherit; }
  select, button { padding: 6px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--card); color: var(--fg); }
  button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  button:disabled { opacity: .5; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  @media (max-width: 800px) { .grid { grid-template-columns: 1fr; } }
  textarea { width: 100%; min-height: 260px; font: 12px/1.4 ui-monospace, Menlo, monospace; padding: 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--card); color: var(--fg); resize: vertical; }
  label.small { font-size: 12px; color: var(--muted); display: block; margin-bottom: 4px; }
  #status { color: var(--muted); font-size: 13px; }
  #bar { height: 4px; background: var(--accent); width: 0; transition: width .2s; border-radius: 2px; }
  #barwrap { height: 4px; background: var(--line); border-radius: 2px; margin: 8px 0 16px; }
  table { border-collapse: collapse; width: 100%; background: var(--card); border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { font-weight: 600; color: var(--muted); font-size: 12px; }
  .opt { display: grid; grid-template-columns: 140px 1fr 60px; gap: 8px; align-items: center; font-size: 12px; }
  .opt .track { height: 10px; background: var(--bar); border-radius: 5px; overflow: hidden; }
  .opt .fill { height: 100%; background: var(--accent); }
  .opt.best .name { font-weight: 600; }
  .mono { font-family: ui-monospace, Menlo, monospace; font-size: 12px; }
  .usage { color: var(--muted); font-size: 12px; margin: 8px 0; }
  details pre { background: var(--card); border: 1px solid var(--line); padding: 10px; border-radius: 6px; overflow: auto; font-size: 12px; }
  .warn { color: var(--warn); }
</style>
</head>
<body>
<main>
  <h1>grande — 判断モデルをブラウザで</h1>
  <p class="sub">state と型付き質問（choice / score / noul）を入れると、生成せずに 1 forward pass で全質問の確率分布が返ります。すべて自分の GPU（WebGPU）で動き、何もアップロードしません。<a href="https://github.com/bokuweb/grande">github.com/bokuweb/grande</a></p>

  <div class="row">
    <select id="model"></select>
    <button id="load" class="primary">モデルを読み込む</button>
    <span id="status">未読み込み</span>
  </div>
  <div id="barwrap"><div id="bar"></div></div>

  <div class="row">
    <label>プリセット <select id="preset"></select></label>
    <label>温度 <input type="range" id="temp" min="0.5" max="4" step="0.1" value="1"> <span id="tempv" class="mono">1.0</span></label>
    <label>実行方式 <select id="mode"><option value="batched">batched（1 forward）</option><option value="sequential">sequential（質問ごと）</option></select></label>
    <button id="run" class="primary" disabled>実行 ⌘↵</button>
  </div>

  <div class="grid">
    <div><label class="small">state（JSON または文字列）</label><textarea id="state"></textarea></div>
    <div><label class="small">questions（JSON）</label><textarea id="questions"></textarea></div>
  </div>

  <div class="usage" id="usage"></div>
  <div id="results"></div>
  <details><summary>レスポンス JSON</summary><pre id="raw"></pre></details>
</main>
<script type="module" src="./app.js"></script>
</body>
</html>
