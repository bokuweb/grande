[package]
name = "omg-web"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "wasm-bindgen surface of omg-core for the browser demo: render a request, turn option logits into typed answers, and the wgpu engine on WebGPU."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
omg-core = { path = "../omg-core" }
wasm-bindgen = "0.2"
serde.workspace = true
serde_json.workspace = true
indexmap.workspace = true
omg-wgpu = { path = "../omg-wgpu", default-features = false, features = ["web", "laya", "e5"], optional = true }
wasm-bindgen-futures = { version = "0.4", optional = true }
js-sys = { version = "0.3", optional = true }

[features]
default = ["wgpu"]
# The wgpu engine (Gemma 3 forward pass on WebGPU) behind `WgpuEngine`.
wgpu = ["dep:omg-wgpu", "dep:wasm-bindgen-futures", "dep:js-sys"]
