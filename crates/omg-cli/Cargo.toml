[package]
name = "omg-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "omg"
path = "src/main.rs"

[dependencies]
omg-core = { path = "../omg-core" }
omg-llama = { path = "../omg-llama" }
omg-wgpu = { path = "../omg-wgpu" }
omg-eval = { path = "../omg-eval" }
omg-server = { path = "../omg-server" }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
axum = "0.8"
anyhow.workspace = true
half = "2"
clap.workspace = true
serde_json.workspace = true
indexmap.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[features]
default = ["metal"]
metal = ["omg-llama/metal"]
cuda = ["omg-llama/cuda"]
vulkan = ["omg-llama/vulkan"]
