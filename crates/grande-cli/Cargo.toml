[package]
name = "grande-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "grande"
path = "src/main.rs"

[dependencies]
grande-core = { path = "../grande-core" }
grande-llama = { path = "../grande-llama" }
anyhow.workspace = true
clap.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[features]
default = ["metal"]
metal = ["grande-llama/metal"]
cuda = ["grande-llama/cuda"]
vulkan = ["grande-llama/vulkan"]
